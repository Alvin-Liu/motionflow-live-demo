<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionFlow — Creative workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --surface:#161718;
  --surface-soft:rgba(218,220,224,.10);
  --surface-hover:rgba(218,220,224,.14);
  --line:rgba(218,220,224,.08);
  --line-strong:rgba(218,220,224,.14);
  --text:#fff;
  --muted:#aeb0b4;
  --muted2:#85878b;
  --blue:#a8c7fa;
  --blue-dark:#0b57d0;
  --panel-w:360px;
  --nav-w:232px;
  --header-h:76px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Google Sans Text","Google Sans",Arial,sans-serif;font-size:16px;line-height:24px}
button,input,[contenteditable]{font:inherit;color:inherit}
button{cursor:pointer}
.material-symbols-rounded{font-family:"Material Symbols Rounded";font-weight:300;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
.app{
  position:relative;
  width:100vw;
  height:100vh;
  background:#000;
  --right-w:var(--panel-w);
  --left-w:var(--nav-w);
}
.app.agent-closed{--right-w:0px}
.app.nav-collapsed{--left-w:72px}
.header{
  position:absolute;z-index:30;left:0;right:8px;top:0;height:var(--header-h);
  display:flex;align-items:center;padding:0 24px 0 20px;pointer-events:none;
}
.header>*{pointer-events:auto}
.header-left{position:absolute;left:20px;top:18px;height:40px;width:680px;display:flex;align-items:center;gap:8px}
.icon-btn{
  width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#e3e3e3;display:grid;place-items:center;padding:0
}
.icon-btn:hover{background:var(--surface-soft)}
.project-title{
  width:132px;height:26px;border:0;background:transparent;outline:none;color:#fff;font-size:16px;line-height:26px;padding:1px 2px;
}
.project-title:focus{border-bottom:1px solid #777}
.header-more{margin-left:-8px}
.search-wrap{
  position:absolute;left:calc(50% - 2px);top:18px;transform:translateX(-50%);width:480px;height:40px;display:flex;align-items:center;gap:8px
}
.search-box{
  width:430px;height:40px;border:1px solid rgba(218,220,224,.05);border-radius:16px;background:var(--surface-soft);
  display:flex;align-items:center;padding:0 3px 0 11px
}
.search-box .material-symbols-rounded{font-size:21px;color:#e3e3e3}
.search-input{flex:1;min-width:0;height:26px;border:0;background:transparent;outline:none;padding:1px 8px;color:#fff;font-size:16px;font-weight:500;line-height:24px}
.search-input::placeholder{color:#a7a7aa}
.filter-btn{width:42px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:#e3e3e3}
.filter-btn:hover{background:var(--surface-soft)}
.header-right{
  position:absolute;right:24px;top:10px;height:56px;display:flex;align-items:center;gap:6px
}
.header-action{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:#e3e3e3;padding:0}
.header-action:hover{background:var(--surface-soft)}
.lang-btn{display:none}
.avatar{width:64px;height:56px;margin-left:6px;position:relative;color:transparent;background:transparent;border:0}
.avatar:after{content:"A";position:absolute;left:12px;top:8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#3949ab,#8e24aa);color:#fff;font-size:12px;font-weight:700;border:4px solid #202124}

.sidebar{
  position:absolute;z-index:20;left:0;top:var(--header-h);bottom:0;width:var(--left-w);
  padding:0 0 12px 0;background:#000;overflow:hidden;transition:width .18s ease
}
.nav-inner{height:100%;width:var(--nav-w);padding:0 16px 36px;display:flex;flex-direction:column}
.nav-list{display:flex;flex-direction:column;gap:4.8px}
.nav-item{
  width:215px;height:48px;border:0;background:transparent;border-radius:16px;color:#fff;
  display:flex;align-items:center;gap:16px;padding:0 16px 0 12px;text-align:left;font-size:14px;font-weight:500;line-height:20px
}
.nav-item:hover{background:rgba(218,220,224,.10)}
.nav-item.active{background:rgba(218,220,224,.25)}
.nav-item .material-symbols-rounded{font-size:24px;color:#fff;min-width:24px}
.nav-sep{height:1px;width:199px;background:rgba(218,220,224,.07);margin:3.4px 8px}
.nav-spacer{flex:1}
.nav-bottom{display:flex;flex-direction:column;gap:4.8px}
.nav-collapsed .nav-item{width:48px;padding:0 12px;gap:0}
.nav-collapsed .nav-item span:last-child{display:none}
.nav-collapsed .nav-inner{padding:0 12px 36px}
.nav-collapsed .nav-sep{width:40px;margin-left:4px}

.center{
  position:absolute;left:var(--left-w);right:calc(var(--right-w) + 8px);top:0;bottom:0;overflow:hidden;transition:left .18s ease,right .18s ease
}
.center-scroll{position:absolute;inset:0;padding-top:var(--header-h);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.center-scroll::-webkit-scrollbar{display:none}
.media-grid{
  min-height:calc(100% - var(--header-h));padding:0 16px 48px;display:grid;
  grid-template-columns:repeat(auto-fill,250px);grid-auto-rows:250px;gap:8px;align-content:start;justify-content:start
}
.media-card{
  position:relative;width:250px;height:250px;border-radius:16px;overflow:hidden;background:#111;border:0;padding:0;color:#fff
}
.media-thumb{position:absolute;inset:0;background:#151515}
.media-card:hover .media-thumb{filter:brightness(.84)}
.thumb-character{
  background:
    radial-gradient(circle at 50% 30%,#c6a88d 0 8%,transparent 8.4%),
    radial-gradient(ellipse at 50% 44%,#25282d 0 12%,transparent 12.5%),
    radial-gradient(ellipse at 50% 83%,#25282d 0 29%,transparent 30%),
    linear-gradient(145deg,#a1a1a1,#52565c 48%,#1a1c1f)
}
.thumb-sneaker{
  background:
    radial-gradient(ellipse at 50% 66%,rgba(203,169,112,.24),transparent 22%),
    radial-gradient(circle at 52% 35%,#4a4236 0 8%,#1a1b1e 24%,#07080a 64%)
}
.thumb-sneaker:after{
  content:"";position:absolute;width:52%;height:20%;left:24%;top:48%;border-radius:55% 36% 48% 36%;
  background:linear-gradient(165deg,#494a50,#101115 46%,#232329 67%,#08080a);transform:skewX(-10deg) rotate(-4deg);box-shadow:0 24px 35px #000d
}
.thumb-orbit{background:conic-gradient(from 185deg at 50% 50%,#09090b,#4c3820,#0c0d10,#26262c,#09090b)}
.thumb-orbit:after{content:"";position:absolute;width:50%;height:18%;left:25%;top:48%;border-radius:55% 36%;background:linear-gradient(165deg,#46464d,#0c0d10 60%);transform:skewX(-9deg) rotate(16deg);box-shadow:0 20px 30px #000d}
.thumb-city{background:linear-gradient(178deg,#1b2735 0 42%,#1a1515 43% 58%,#070708 59%),radial-gradient(circle at 72% 20%,#ffb74d,transparent 8%)}
.thumb-water{background:linear-gradient(#17181d 0 52%,#344a54 53% 55%,#07080a 56%)}
.media-name{
  position:absolute;left:0;right:0;bottom:0;height:52px;padding:12px 16px;display:block;
  font-size:22px;line-height:28px;font-weight:400;color:#e3e3e3;background:linear-gradient(transparent,rgba(0,0,0,.82));
  text-shadow:0 1px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.media-badge{position:absolute;left:0;top:0;width:46px;height:46px;background:transparent;display:grid;place-items:center;color:#fff;text-shadow:0 1px 5px #000}
.card-tools{position:absolute;right:8px;top:8px;width:66px;height:36px;padding:4px;display:flex;gap:2px;opacity:0;transition:.15s;background:rgba(255,255,255,.5);border-radius:12px}
.media-card:hover .card-tools{opacity:1}
.card-icon{width:28px;height:28px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:#fff;padding:0}
.card-icon:hover{background:rgba(0,0,0,.14)}
.card-icon .material-symbols-rounded{font-size:18px}
.empty-state{
  display:none;position:absolute;inset:var(--header-h) 0 0;align-items:center;justify-content:center;color:#aeb0b4
}
.empty-state.show{display:flex}
.empty-copy{text-align:center}
.empty-copy .material-symbols-rounded{font-size:48px;color:#6f7175}
.empty-copy h2{font-weight:400;font-size:18px;color:#e6e6e6;margin:12px 0 5px}
.empty-copy p{margin:0;font-size:13px}

.agent-area{
  position:absolute;z-index:21;right:8px;top:0;bottom:0;width:var(--panel-w);padding-top:var(--header-h);transition:transform .18s ease,opacity .18s ease
}
.agent-closed .agent-area{transform:translateX(calc(100% + 8px));opacity:0;pointer-events:none}
.agent-wrap{height:100%;padding:0 4px 12px 12px}
.agent-panel{
  position:relative;height:100%;width:344px;background:rgba(22,23,24,.9);border-radius:16px;overflow:hidden;color:#e3e3e3
}
.agent-header{
  position:absolute;left:0;right:0;top:0;height:48px;display:flex;align-items:center;padding:0 8px;gap:4px
}
.agent-header .icon-btn{width:34px;height:34px}
.agent-session{font-size:16px;font-weight:500;line-height:24px;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.agent-content{
  position:absolute;left:0;right:0;top:48px;bottom:114px;overflow:auto;padding:16px;scrollbar-width:none
}
.agent-content::-webkit-scrollbar{display:none}
.agent-empty{position:relative;min-height:100%;display:block}
.agent-greeting{position:absolute;top:142px;left:0;right:0;margin:0;text-align:center;padding:0}
.agent-greeting h3{font-family:"Google Sans",Arial,sans-serif;font-size:24px;line-height:32px;margin:0;font-weight:400;color:rgba(218,220,224,.5)}
.agent-greeting h4{font-family:"Google Sans",Arial,sans-serif;font-size:24px;line-height:32px;margin:8px 0 0;font-weight:400;color:rgba(218,220,224,.5)}
.suggestions{position:absolute;top:356px;left:32px;display:flex;flex-direction:column;gap:12px}
.suggestion{
  width:280px;height:80px;margin:0 auto;border:0;border-radius:16px;background:var(--surface-soft);color:#fff;
  display:flex;align-items:center;padding:8px;gap:12px;text-align:left;font-size:14px
}
.sug-art{width:64px;height:64px;min-width:64px;border-radius:12px;position:relative;overflow:hidden;background:#2a2b2e}
.sug-art.a{background:radial-gradient(circle at 42% 38%,#b6d0ff 0 8%,transparent 9%),linear-gradient(145deg,#263850,#17181b)}
.sug-art.a:after{content:"";position:absolute;left:17px;right:17px;bottom:13px;height:22px;border-radius:12px 12px 5px 5px;background:#7fa8e8}
.sug-art.b{background:linear-gradient(145deg,#322c45,#17181b)}
.sug-art.b:before,.sug-art.b:after{content:"";position:absolute;width:19px;height:28px;border-radius:7px;background:#8d79c7;top:18px}.sug-art.b:before{left:11px;transform:rotate(-8deg)}.sug-art.b:after{right:11px;transform:rotate(8deg)}
.sug-art.c{background:linear-gradient(145deg,#3e3428,#17181b)}
.sug-art.c:after{content:"";position:absolute;width:38px;height:19px;left:13px;top:25px;border-radius:50% 35%;background:linear-gradient(165deg,#a08a68,#313239);transform:skewX(-8deg)}
.suggestion-label{font-size:14px;line-height:20px;font-weight:500}
.suggestion:hover{background:var(--surface-hover)}
.suggestion .material-symbols-rounded{font-size:23px;color:#dfe1e5}
.chat-log{display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:92%;font-size:13px;line-height:1.5;color:#e3e3e3;padding:10px 12px;border-radius:14px;background:rgba(218,220,224,.08)}
.chat-msg.user{align-self:flex-end;background:#2b3b54;color:#fff}
.agent-prompt{position:absolute;left:0;right:0;bottom:0;height:114px;padding:8px}
.prompt-box{
  height:98px;border-radius:24px;background:rgba(22,23,24,.9);border:1px solid rgba(218,220,224,.05);padding:12px 8px 8px 10px
}
.prompt-edit{
  width:304px;height:36px;padding:4px 8px 12px;outline:none;overflow:hidden;white-space:pre-wrap;font-size:14px;line-height:20px;color:#fff
}
.prompt-edit:empty:before{content:attr(data-placeholder);color:#b9babd;pointer-events:none}
.prompt-actions{height:32px;margin-top:8px;display:flex;align-items:center;gap:4px}
.prompt-actions .icon-btn{width:32px;height:32px}
.prompt-actions .material-symbols-rounded{font-size:20px}
.prompt-spacer{flex:1}
.send-btn{width:32px;height:32px;border:0;border-radius:50%;background:#e8eaed;color:#202124;display:grid;place-items:center}
.send-btn .material-symbols-rounded{font-size:20px;font-weight:500}
.send-btn:disabled{background:#3c4043;color:#777}

.agent-settings{position:absolute;inset:0;z-index:20;display:none;background:rgba(22,23,24,.98);border-radius:16px;color:#e3e3e3}
.agent-settings.show{display:block}
.settings-back,.settings-close{position:absolute;top:7px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#e3e3e3;display:grid;place-items:center;padding:0}
.settings-back:hover,.settings-close:hover{background:rgba(218,220,224,.10)}
.settings-back{left:8px}.settings-close{right:8px}
.settings-back .material-symbols-rounded,.settings-close .material-symbols-rounded{font-size:21px}
.settings-title{position:absolute;left:49px;top:4px;height:24px;margin:0;font-size:16px;line-height:24px;font-weight:500;color:#fff}
.settings-section-label{position:absolute;left:7px;width:328px;height:16px;padding:0 8px;color:rgba(218,220,224,.75);font-size:12px;line-height:16px;font-weight:500}
.confirm-label{top:40.5px}
.image-label{top:174.5px}
.video-label{top:357.7px}
.confirm-option{position:absolute;left:7px;width:328px;height:46px;border:0;background:transparent;color:#fff;text-align:left;padding:0 8px 0 48px}
.confirm-option.always{top:58px}.confirm-option.never{top:104px}
.confirm-option:before{content:"";position:absolute;left:12px;top:13px;width:18px;height:18px;border:2px solid #9aa0a6;border-radius:50%}
.confirm-option.selected:before{border-color:#a8c7fa}
.confirm-option.selected:after{content:"";position:absolute;left:17px;top:18px;width:12px;height:12px;border-radius:50%;background:#a8c7fa}
.confirm-option b{display:block;font-size:12px;line-height:16px;font-weight:500;color:rgba(218,220,224,.9)}
.confirm-option small{display:block;margin-top:2px;font-size:10px;line-height:14px;font-weight:400;color:rgba(218,220,224,.55);white-space:nowrap}
.setting-grid{position:absolute;left:7px;width:328px;display:grid;background:rgba(218,220,224,.05);border-radius:12px;overflow:hidden}
.setting-grid.ratios-image{top:196.5px;height:61.2px;grid-template-columns:repeat(5,1fr);gap:1px}
.setting-grid.counts-image{top:261.7px;height:34px;grid-template-columns:repeat(4,1fr);gap:1px}
.setting-grid.ratios-video{top:379.7px;height:61.2px;grid-template-columns:repeat(2,1fr);gap:1px}
.setting-grid.counts-video{top:444.9px;height:34px;grid-template-columns:repeat(4,1fr);gap:1px}
.setting-choice{border:0;background:transparent;color:#fff;font-size:12px;line-height:16px;font-weight:500;position:relative;padding:0;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:12px}
.setting-grid.ratios-image .setting-choice,.setting-grid.ratios-video .setting-choice{flex-direction:column;gap:0}
.setting-choice:hover{background:rgba(218,220,224,.09)}
.setting-choice.selected{background:rgba(218,220,224,.15)}
.setting-choice .material-symbols-rounded{font-size:18px;line-height:18px}
.setting-grid.ratios-image .setting-choice span:last-child,.setting-grid.ratios-video .setting-choice span:last-child{font-size:12px;line-height:24px}
.model-choice{position:absolute;left:7px;width:328px;height:34px;border:0;border-radius:12px;background:rgba(218,220,224,.05);color:#fff;padding:0 12px;display:flex;align-items:center;font-size:12px;font-weight:500;text-align:left}
.model-choice.image-model{top:299.7px}.model-choice.video-model{top:482.9px}
.model-choice .material-symbols-rounded{margin-left:auto;font-size:18px}
.settings-save{position:absolute;left:7px;bottom:15px;width:328px;height:40px;border:0;border-radius:20px;background:#e8eaed;color:#000;font-size:14px;line-height:20px;font-weight:500}
.settings-save:hover{background:#fff}
.model-menu{position:absolute;left:7px;width:328px;z-index:30;display:none;border-radius:12px;background:#292a2d;border:1px solid rgba(255,255,255,.08);padding:5px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.model-menu.show{display:block}
.model-menu.image-menu{top:337px}.model-menu.video-menu{top:520px}
.model-item{height:36px;width:100%;border:0;background:transparent;border-radius:8px;color:#fff;text-align:left;padding:0 9px;font-size:12px}
.model-item:hover{background:rgba(255,255,255,.08)}

.popover{
  position:fixed;z-index:80;display:none;min-width:220px;border-radius:12px;background:#202124;border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 40px rgba(0,0,0,.5);padding:6px
}
.popover.show{display:block}
.pop-item{height:40px;border:0;background:transparent;border-radius:8px;color:#e8eaed;width:100%;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;font-size:13px}
.pop-item:hover{background:rgba(255,255,255,.08)}
.pop-item .material-symbols-rounded{font-size:20px}
.help-card{
  position:fixed;z-index:90;right:76px;top:64px;width:330px;border-radius:16px;background:#202124;border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 50px rgba(0,0,0,.55);padding:18px;display:none
}
.help-card.show{display:block}
.help-card h3{font-size:16px;margin:0 0 8px}
.help-card p{font-size:12px;color:#bdc1c6;line-height:1.6;margin:0 0 12px}
.help-steps{display:grid;gap:8px}
.help-step{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#e8eaed}
.help-n{min-width:22px;height:22px;border-radius:50%;background:#3c4043;display:grid;place-items:center;font-size:10px}
.toast{
  position:fixed;z-index:120;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:#303134;color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;box-shadow:0 8px 26px rgba(0,0,0,.5);transition:.18s
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1250px){
  :root{--panel-w:340px;--nav-w:210px}
  .nav-inner{width:210px}.nav-item{width:194px}
  .search-wrap{width:400px}.search-box{width:350px}
  .media-grid{grid-template-columns:repeat(auto-fill,220px);grid-auto-rows:220px}
  .media-card{width:220px;height:220px}
  .agent-panel{width:324px}.agent-area{width:340px}.suggestion{width:260px}
}
@media(max-width:980px){
  .app{--right-w:0px;--left-w:72px}
  .sidebar{width:72px}.nav-inner{padding:0 12px;width:72px}.nav-item{width:48px;padding:0 13px;gap:0}.nav-item span:last-child{display:none}.nav-sep{width:40px;margin-left:4px}
  .agent-area{display:none}.search-wrap{width:360px}.search-box{width:310px}
  .header-left{width:260px}.project-title{width:120px}
  .header-right .header-action:nth-child(2),.header-right .header-action:nth-child(3){display:none}
}
@media(max-width:680px){
  .header{right:0;padding-right:10px}.header-left{left:10px}.project-title{display:none}.header-left .header-more{display:none}
  .search-wrap{left:58px;right:120px;transform:none;width:auto}.search-box{width:100%}.filter-btn{display:none}
  .header-right{right:8px}.lang-btn{display:none}.avatar{width:34px;height:34px}
  .center{left:0}.sidebar{display:none}
  .media-grid{padding:0 10px 34px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;gap:6px}
  .media-card{width:100%;height:auto;aspect-ratio:1}.media-name{font-size:11px;padding:9px 10px;height:44px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="header-left">
      <button class="icon-btn" id="homeBtn" title="Home"><span class="material-symbols-rounded">home</span></button>
      <input class="project-title" id="projectTitle" value="Sneaker Launch">
      <button class="icon-btn header-more" id="projectMenuBtn"><span class="material-symbols-rounded">more_vert</span></button>
    </div>
    <div class="search-wrap">
      <div class="search-box"><span class="material-symbols-rounded">search</span><input class="search-input" id="searchInput" placeholder="搜索"></div>
      <button class="filter-btn" id="filterBtn"><span class="material-symbols-rounded">filter_list</span></button>
    </div>
    <div class="header-right">

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let lang=localStorage.getItem('flow-demo-lang')||'zh';
let currentView='all', currentFilter='all';
let nextId=7;
const media=[
  {id:1,type:'character',titleZh:'未命名的角色',titleEn:'Untitled character',thumb:'thumb-character'},

const I={
 zh:{

  session:'未命名的会话',hello:'alvin，您好！',question:'您想创作什么内容？',cap:'告诉我你能做什么',brain:'与我一起头脑风暴',edit:'编辑图片',
  prompt:'您希望创作什么？',all:'全部',images:'图片',videos:'视频',chars:'角色',newImage:'新建图片',newVideo:'新建视频',newChar:'新建角色',
  hideAgent:'隐藏创作面板',showAgent:'显示创作面板',switchLang:'Switch to English',
  empty:'暂无媒体',emptySub:'从右侧会话开始创作。',trashEmpty:'回收站为空',trashSub:'删除的内容会显示在这里。',
  helpTitle:'怎么用 Flow 风格工作区？',helpCopy:'左侧管理媒体类型，中间查看项目素材，右侧会话面板负责头脑风暴、生成和编辑。生成结果会回到中间媒体网格。',
  h:['在右侧输入你想创作的内容。','使用 + 添加参考素材，或选择快捷任务。','生成的图片、视频、角色会进入中间媒体区。','左侧“场景”用于查看和组合视频片段。'],
  agentSettings:'智能体设置',confirmBefore:'生成前先确认',always:'始终',alwaysDesc:'智能体将在生成媒体内容之前征求确认。',never:'永不',neverDesc:'智能体将自动生成媒体内容并消耗点数。',imageDefaults:'图片生成默认设置',videoDefaults:'视频生成默认设置',save:'保存',saved:'默认生成设置已保存（Mock）',
  thinking:'正在构思…',created:'已生成一个新素材（Mock）',attached:'已添加参考素材（Mock）',settings:'生成设置',home:'这是项目内部 Demo，首页未实现。',
  assistant:'可以。我们先确定画面主体、环境、镜头语言和节奏。你也可以直接让我生成一张关键帧或一段视频。',
  boardReply:'我会把创意拆成 3 个画面：① 产品揭幕；② 环绕细节；③ 英雄收尾。先生成关键帧确认方向，再转成视频。',
  editReply:'选择中间任意图片后，可以继续用自然语言说明要修改的区域、灯光或背景。'
 },
 en:{
  search:'Search',allMedia:'All media',characters:'Characters',scenes:'Scenes',tools:'Tools',trash:'Trash',collapse:'Collapse',
  session:'Untitled session',hello:'Hi Alvin!',question:'What would you like to create?',cap:'Tell me what you can do',brain:'Brainstorm with me',edit:'Edit an image',

  hideAgent:'Hide creation panel',showAgent:'Show creation panel',switchLang:'切换到中文',
  empty:'No media yet',emptySub:'Start creating from the panel on the right.',trashEmpty:'Trash is empty',trashSub:'Deleted media will appear here.',

  h:['Describe what you want to create in the right panel.','Use + to add references, or choose a quick task.','Generated images, videos and characters appear in the center.','Use Scenes on the left to browse and compose video clips.'],
  agentSettings:'Agent settings',confirmBefore:'Confirm before generating',always:'Always',alwaysDesc:'The agent will ask before generating media.',never:'Never',neverDesc:'The agent will automatically generate media and spend credits.',imageDefaults:'Image generation defaults',videoDefaults:'Video generation defaults',save:'Save',saved:'Default generation settings saved (mock)',
  thinking:'Thinking…',created:'New mock asset generated',attached:'Reference attached (mock)',settings:'Generation settings',home:'This demo focuses on the project workspace.',

  boardReply:'I’d break the idea into three frames: ① product reveal, ② orbit details, ③ hero payoff. Generate keyframes first, then animate the approved direction.',
  editReply:'Select any image in the center, then describe the area, lighting or background you want to change.'
 }
};
function t(){return I[lang]}
function iconFor(type){return type==='video'?'movie':type==='character'?'accessibility_new':'image'}
function typeLabel(type){const q=t();return type==='video'?q.videos:type==='character'?q.chars:q.images}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function renderMedia(){
 const q=t();const grid=$('#mediaGrid');grid.innerHTML='';
 let list=media.filter(m=>{
   if(currentView==='trash')return false;
   if(currentView==='characters'&&m.type!=='character')return false;
   if(currentView==='scenes'&&m.type!=='video')return false;
   if(currentView==='tools')return false;
   if(currentFilter!=='all'&&m.type!==currentFilter)return false;
   const s=$('#searchInput').value.trim().toLowerCase();if(s){const name=(lang==='zh'?m.titleZh:m.titleEn).toLowerCase();if(!name.includes(s))return false}
   return true
 });
 if(currentView==='tools'){
   const tools=[
    {nameZh:'帧转视频',nameEn:'Frames to video',icon:'movie_edit'},
    {nameZh:'相机控制',nameEn:'Camera controls',icon:'videocam'},
    {nameZh:'图片编辑',nameEn:'Image edit',icon:'edit_square'},
    {nameZh:'视频延长',nameEn:'Extend video',icon:'add_to_queue'}
   ];
   tools.forEach((o,i)=>{const c=document.createElement('button');c.className='media-card';c.innerHTML='<div class="media-thumb" style="display:grid;place-items:center;background:linear-gradient(145deg,#17181a,#0b0b0c)"><span class="material-symbols-rounded" style="font-size:58px;color:#9aa0a6">'+o.icon+'</span></div><div class="media-name">'+(lang==='zh'?o.nameZh:o.nameEn)+'</div>';c.onclick=()=>toast(lang==='zh'?'工具演示（Mock）':'Tool demo (mock)');grid.appendChild(c)});
 }
 list.forEach(m=>{
   const card=document.createElement('button');card.className='media-card';card.dataset.id=m.id;
   card.innerHTML='<div class="media-thumb '+m.thumb+'"></div><div class="media-badge"><span class="material-symbols-rounded" style="font-size:22px">'+iconFor(m.type)+'</span></div><div class="card-tools"><button class="card-icon favorite"><span class="material-symbols-rounded">favorite</span></button><button class="card-icon cardmore"><span class="material-symbols-rounded">more_vert</span></button></div><div class="media-name">'+(lang==='zh'?m.titleZh:m.titleEn)+'</div>';
   card.onclick=e=>{if(e.target.closest('.card-icon'))return;selectMedia(m)};
   card.querySelector('.favorite').onclick=e=>{e.stopPropagation();e.currentTarget.querySelector('.material-symbols-rounded').style.color='#ff6b81'};
   card.querySelector('.cardmore').onclick=e=>{e.stopPropagation();toast(lang==='zh'?'更多操作（Mock）':'More actions (mock)')};
   grid.appendChild(card)
 });
 const empty=$('#emptyState');const shouldEmpty=(currentView!=='tools'&&list.length===0);
 empty.classList.toggle('show',shouldEmpty);
 if(currentView==='trash'){$('#emptyTitle').textContent=q.trashEmpty;$('#emptySub').textContent=q.trashSub}else{$('#emptyTitle').textContent=q.empty;$('#emptySub').textContent=q.emptySub}
}
function selectMedia(m){
 const q=t();
 $('#agentEmpty').style.display='none';$('#chatLog').style.display='flex';
 appendMsg('user',(lang==='zh'?'选中了：':'Selected: ')+(lang==='zh'?m.titleZh:m.titleEn));
 const reply=document.createElement('div');reply.className='chat-msg';reply.textContent=m.type==='image'?q.editReply:m.type==='video'?(lang==='zh'?'这个视频可以继续延长、调整镜头或作为场景片段使用。':'This video can be extended, reframed, or used as a scene clip.'):(lang==='zh'?'这个角色可以作为后续图片和视频生成的参考。':'This character can be used as a reference in later image and video generations.');
 $('#chatLog').appendChild(reply);$('#agentContent').scrollTop=99999
}
function appendMsg(kind,text){const d=document.createElement('div');d.className='chat-msg'+(kind==='user'?' user':'');d.textContent=text;$('#chatLog').appendChild(d)}
function setView(v){
 currentView=v;currentFilter='all';$$('.nav-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#searchInput').value='';renderMedia()
}
function applyLang(){
 const q=t();document.documentElement.lang=lang==='zh'?'zh-CN':'en';
 $('#searchInput').placeholder=q.search;
 const map={allMedia:'allMedia',characters:'characters',scenes:'scenes',tools:'tools',trash:'trash',collapse:'collapse'};
 Object.entries(map).forEach(([key,k])=>{$$('[data-i18n="'+key+'"]').forEach(e=>e.textContent=q[k])});
 $('#sessionTitle').textContent=q.session;$('#helloLine').textContent=q.hello;$('#questionLine').textContent=q.question;$('#sugCap').textContent=q.cap;$('#sugBrain').textContent=q.brain;$('#sugEdit').textContent=q.edit;$('#promptEdit').dataset.placeholder=q.prompt;
 $('#fAll').textContent=q.all;$('#fImages').textContent=q.images;$('#fVideos').textContent=q.videos;$('#fChars').textContent=q.chars;
 $('#aImage').textContent=q.newImage;$('#aVideo').textContent=q.newVideo;$('#aChar').textContent=q.newChar;
 $('#toggleAgentText').textContent=$('#app').classList.contains('agent-closed')?q.showAgent:q.hideAgent;$('#toggleLangText').textContent=q.switchLang;$('#langBtn').textContent=lang==='zh'?'中 / EN':'EN / 中';
 $('#agentSettingsTitle').textContent=q.agentSettings;$('#confirmLabel').textContent=q.confirmBefore;$('#alwaysLabel').textContent=q.always;$('#alwaysDesc').textContent=q.alwaysDesc;$('#neverLabel').textContent=q.never;$('#neverDesc').textContent=q.neverDesc;$('#imageDefaultsLabel').textContent=q.imageDefaults;$('#videoDefaultsLabel').textContent=q.videoDefaults;$('#settingsSave').textContent=q.save;
 $('#helpTitle').textContent=q.helpTitle;$('#helpCopy').textContent=q.helpCopy;for(let i=1;i<=4;i++)$('#help'+i).textContent=q.h[i-1];
 renderMedia()
}
function sendPrompt(text){
 const val=(text??$('#promptEdit').textContent).trim();if(!val)return;
 $('#agentEmpty').style.display='none';$('#chatLog').style.display='flex';appendMsg('user',val);$('#promptEdit').textContent='';$('#sendBtn').disabled=true;
 const typing=document.createElement('div');typing.className='chat-msg';typing.textContent=t().thinking;$('#chatLog').appendChild(typing);$('#agentContent').scrollTop=99999;
 setTimeout(()=>{typing.remove();appendMsg('assistant',t().assistant);$('#agentContent').scrollTop=99999;addGeneratedAsset(val)},650)
}
function addGeneratedAsset(prompt){
 const isVideo=/视频|video|animate|动画/i.test(prompt);const item={id:nextId++,type:isVideo?'video':'image',titleZh:isVideo?'新生成的视频':'新生成的图片',titleEn:isVideo?'Generated video':'Generated image',thumb:isVideo?'thumb-orbit':'thumb-sneaker'};media.unshift(item);if(currentView!=='all')setView('all');else renderMedia();toast(t().created)
}
function placePop(pop,anchor,offsetX=0){const r=anchor.getBoundingClientRect();pop.style.left=Math.max(8,r.right-pop.offsetWidth+offsetX)+'px';pop.style.top=(r.bottom+6)+'px'}
function closePops(){$$('.popover').forEach(p=>p.classList.remove('show'));$('#helpCard').classList.remove('show')}
$$('.nav-item[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#collapseBtn').onclick=()=>{$('#app').classList.toggle('nav-collapsed');$('#collapseBtn .material-symbols-rounded').textContent=$('#app').classList.contains('nav-collapsed')?'right_panel_open':'left_panel_close'};
$('#closeAgentBtn').onclick=()=>{$('#app').classList.add('agent-closed');applyLang()};
$('#toggleAgentItem').onclick=()=>{$('#app').classList.toggle('agent-closed');closePops();applyLang()};
$('#newSessionBtn').onclick=()=>{$('#chatLog').innerHTML='';$('#chatLog').style.display='none';$('#agentEmpty').style.display='flex';$('#sessionTitle').textContent=t().session};
$('#promptEdit').oninput=()=>$('#sendBtn').disabled=!$('#promptEdit').textContent.trim();
$('#promptEdit').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendPrompt()}};
$('#sendBtn').onclick=()=>sendPrompt();
$$('.suggestion').forEach(b=>b.onclick=()=>{const type=b.dataset.prompt;const q=t();$('#agentEmpty').style.display='none';$('#chatLog').style.display='flex';const user=type==='capabilities'?q.cap:type==='brainstorm'?q.brain:q.edit;appendMsg('user',user);setTimeout(()=>appendMsg('assistant',type==='edit'?q.editReply:q.assistant),250)});
$('#attachBtn').onclick=()=>toast(t().attached);
function openAgentSettings(){$('#agentSettings').classList.add('show');$('#imageModelMenu').classList.remove('show');$('#videoModelMenu').classList.remove('show')}
function closeAgentSettings(){$('#agentSettings').classList.remove('show')}
$('#tuneBtn').onclick=openAgentSettings;
$('#settingsBack').onclick=closeAgentSettings;$('#settingsClose').onclick=closeAgentSettings;
[...document.querySelectorAll('.confirm-option')].forEach(b=>b.onclick=()=>{[...document.querySelectorAll('.confirm-option')].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
[...document.querySelectorAll('.setting-choice')].forEach(b=>b.onclick=()=>{[...document.querySelectorAll('.setting-choice[data-group="'+b.dataset.group+'"]')].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
$('#imageModelBtn').onclick=()=>{$('#imageModelMenu').classList.toggle('show');$('#videoModelMenu').classList.remove('show')};
$('#videoModelBtn').onclick=()=>{$('#videoModelMenu').classList.toggle('show');$('#imageModelMenu').classList.remove('show')};
[...document.querySelectorAll('.model-item[data-model="image"]')].forEach(b=>b.onclick=()=>{$('#imageModelText').textContent=b.textContent;$('#imageModelMenu').classList.remove('show')});
[...document.querySelectorAll('.model-item[data-model="video"]')].forEach(b=>b.onclick=()=>{$('#videoModelText').textContent=b.textContent;$('#videoModelMenu').classList.remove('show')});
$('#settingsSave').onclick=()=>{closeAgentSettings();toast(t().saved)};
$('#sparkBtn').onclick=()=>{$('#promptEdit').textContent=lang==='zh'?'制作一段高级感的黑色运动鞋广告，暗色摄影棚，蓝色边缘光':'Create a premium black sneaker ad in a dark studio with blue rim lighting';$('#sendBtn').disabled=false};
$('#searchInput').oninput=renderMedia;
$('#filterBtn').onclick=e=>{closePops();const p=$('#filterPop');p.classList.add('show');placePop(p,e.currentTarget)};
$$('#filterPop .pop-item').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;closePops();renderMedia()});
$('#addBtn').onclick=e=>{closePops();const p=$('#addPop');p.classList.add('show');placePop(p,e.currentTarget)};
$$('#addPop .pop-item').forEach(b=>b.onclick=()=>{const type=b.dataset.add;media.unshift({id:nextId++,type,titleZh:type==='video'?'未命名的视频':type==='character'?'未命名的角色':'未命名的图片',titleEn:type==='video'?'Untitled video':type==='character'?'Untitled character':'Untitled image',thumb:type==='video'?'thumb-orbit':type==='character'?'thumb-character':'thumb-sneaker'});closePops();setView('all');toast(t().created)});
$('#settingsBtn').onclick=e=>{closePops();const p=$('#settingsPop');p.classList.add('show');placePop(p,e.currentTarget)};
$('#moreBtn').onclick=e=>{closePops();toast(lang==='zh'?'更多项目选项（Mock）':'More project options (mock)')};
$('#helpBtn').onclick=()=>{closePops();$('#helpCard').classList.toggle('show')};
$('#homeBtn').onclick=()=>toast(t().home);
$('#langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('flow-demo-lang',lang);applyLang()};
$('#toggleLangItem').onclick=()=>{$('#langBtn').click();closePops()};
document.addEventListener('click',e=>{if(!e.target.closest('.popover')&&!e.target.closest('#filterBtn')&&!e.target.closest('#addBtn')&&!e.target.closest('#settingsBtn')&&!e.target.closest('#helpBtn')&&!e.target.closest('.help-card'))closePops()});
applyLang();renderMedia();
</script>
</body>
</html>
